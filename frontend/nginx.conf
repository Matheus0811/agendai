server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Rotas do React (ex.: /painel/agenda) sempre caem no index.html
  location / {
    try_files $uri /index.html;
  }
}
